name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev rpm

      - name: Install Wails CLI & nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Linux binary
        run: |
          wails build -tags webkit2_41

      - name: Package Linux releases
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          bash scripts/package-linux.sh "${VERSION}" "amd64" "artifacts"

      - name: Validate Linux package metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RPM="artifacts/flitnix_${VERSION}_linux_amd64.rpm"
          DEB="artifacts/flitnix_${VERSION}_linux_amd64.deb"
          TAR="artifacts/flitnix_${VERSION}_linux_amd64.tar.gz"

          test -f "$RPM"
          test -f "$DEB"
          test -f "$TAR"

          RPM_VERSION="$(rpm -qp --qf '%{VERSION}' "$RPM")"
          test "$RPM_VERSION" = "$VERSION" || {
            echo "Unexpected RPM version: $RPM_VERSION; expected $VERSION" >&2
            exit 1
          }

          DEB_VERSION="$(dpkg-deb -f "$DEB" Version)"
          case "$DEB_VERSION" in
            "$VERSION"|"$VERSION"-*|"$VERSION"+*) ;;
            *)
              echo "Unexpected DEB version: $DEB_VERSION; expected $VERSION" >&2
              exit 1
              ;;
          esac

          echo "Package metadata verified: RPM=$RPM_VERSION DEB=$DEB_VERSION TAR=$(basename "$TAR")"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: linux-artifacts
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Install NSIS
        shell: powershell
        run: |
          Write-Host "Installing NSIS via Chocolatey..."
          choco install nsis --yes --no-progress

          $candidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          )

          $makensisPath = $null
          foreach ($path in $candidates) {
            if (Test-Path $path) {
              $makensisPath = $path
              break
            }
          }

          if (-not $makensisPath) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              $makensisPath = $cmd.Source
            }
          }

          if (-not $makensisPath -or -not (Test-Path $makensisPath)) {
            Write-Error "makensis.exe could not be found after installation."
            exit 1
          }

          $nsisDir = Split-Path -Parent $makensisPath
          Write-Host "Found makensis at: $makensisPath"
          Write-Host "Adding $nsisDir to GITHUB_PATH"
          "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$nsisDir;$env:PATH"

          Write-Host "Verifying makensis version:"
          & "$makensisPath" /VERSION

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Windows Installer
        run: |
          wails build -nsis

      - name: Organize Windows artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          echo "Inspecting build/bin directory contents:"
          ls -la build/bin/ || true

          EXPECTED_INSTALLER="build/bin/flitnix-amd64-installer.exe"
          TARGET_ASSET="artifacts/flitnix_${VERSION}_windows_amd64_setup.exe"

          if [ -f "${EXPECTED_INSTALLER}" ]; then
            echo "Found expected installer: ${EXPECTED_INSTALLER}"
            cp "${EXPECTED_INSTALLER}" "${TARGET_ASSET}"
          else
            echo "Expected installer ${EXPECTED_INSTALLER} not found. Searching for fallback installer..."
            FALLBACK_INSTALLER=$(find build/bin -type f -name "*installer*.exe" 2>/dev/null | head -n 1)
            if [ -n "${FALLBACK_INSTALLER}" ] && [ -f "${FALLBACK_INSTALLER}" ]; then
              echo "Found fallback installer: ${FALLBACK_INSTALLER}"
              cp "${FALLBACK_INSTALLER}" "${TARGET_ASSET}"
            else
              echo "Error: Windows installer was NOT created by Wails build!" >&2
              echo "Listing build/bin contents:" >&2
              ls -la build/bin/ >&2 || true
              exit 1
            fi
          fi

          if [ ! -f "${TARGET_ASSET}" ]; then
            echo "Error: Target asset ${TARGET_ASSET} was not created!" >&2
            exit 1
          fi

          echo "Successfully organized Windows installer: ${TARGET_ASSET}"
          ls -lh "${TARGET_ASSET}"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-artifacts
          path: artifacts/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal App & DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build macOS Universal App
        run: |
          wails build -platform darwin/universal

      - name: Package and verify macOS universal artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts

          # Find app bundle (whether Flitnix.app or flitnix.app)
          APP_DIR=$(ls -d build/bin/*.app 2>/dev/null | head -n 1)
          if [ -z "${APP_DIR}" ] || [ ! -d "${APP_DIR}" ]; then
            echo "Error: macOS .app bundle not found in build/bin!" >&2
            exit 1
          fi
          echo "Found app bundle: ${APP_DIR}"

          # Locate executable inside Contents/MacOS
          APP_EXEC=$(find "${APP_DIR}/Contents/MacOS" -type f -perm +111 2>/dev/null | head -n 1)
          if [ -z "${APP_EXEC}" ] || [ ! -f "${APP_EXEC}" ]; then
            echo "Error: Executable not found in ${APP_DIR}/Contents/MacOS!" >&2
            exit 1
          fi

          echo "Inspecting architecture with lipo:"
          LIPO_OUTPUT="$(lipo -info "${APP_EXEC}")"
          echo "${LIPO_OUTPUT}"

          # Verify universal binary contains both x86_64 (amd64) and arm64
          if ! echo "${LIPO_OUTPUT}" | grep -q "x86_64" || ! echo "${LIPO_OUTPUT}" | grep -q "arm64"; then
            echo "Error: Executable ${APP_EXEC} is not universal! Both x86_64 and arm64 architectures are required." >&2
            exit 1
          fi
          echo "Universal binary architecture verified: x86_64 and arm64 present."

          # Create DMG
          DMG_NAME="artifacts/flitnix_${VERSION}_macOS_universal.dmg"
          hdiutil create -volname "Flitnix" -srcfolder "${APP_DIR}" -ov -format UDZO "${DMG_NAME}"
          test -f "${DMG_NAME}" || {
            echo "Error: DMG artifact ${DMG_NAME} was not created!" >&2
            exit 1
          }

          # Create ZIP
          ZIP_NAME="artifacts/flitnix_${VERSION}_macOS_universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_DIR}" "${ZIP_NAME}"
          test -f "${ZIP_NAME}" || {
            echo "Error: ZIP artifact ${ZIP_NAME} was not created!" >&2
            exit 1
          }

          echo "macOS artifacts created and verified:"
          ls -lh "${DMG_NAME}" "${ZIP_NAME}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: macos-artifacts
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Draft Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate all required release artifacts exist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REQUIRED_ASSETS=(
            "flitnix_${VERSION}_linux_amd64.deb"
            "flitnix_${VERSION}_linux_amd64.rpm"
            "flitnix_${VERSION}_linux_amd64.tar.gz"
            "flitnix_${VERSION}_windows_amd64_setup.exe"
            "flitnix_${VERSION}_macOS_universal.dmg"
            "flitnix_${VERSION}_macOS_universal.zip"
          )
          cd release-assets
          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Error: Required asset '$asset' is missing from release payload!" >&2
              exit 1
            fi
          done
          echo "All 6 required release assets present."

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum flitnix_* > SHA256SUMS.txt
          test -s SHA256SUMS.txt || {
            echo "Error: SHA256SUMS.txt is missing or empty!" >&2
            exit 1
          }
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "Flitnix ${GITHUB_REF_NAME}" \
            --generate-notes
