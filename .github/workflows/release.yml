name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI & nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Linux binary
        run: |
          wails build -tags webkit2_41

      - name: Package Linux releases
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          bash scripts/package-linux.sh "${VERSION}" "amd64" "artifacts"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: linux-artifacts
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Windows Installer
        run: |
          wails build -nsis

      - name: Organize Windows artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          # Wails outputs build/bin/flitnix-amd64-installer.exe
          if [ -f "build/bin/flitnix-amd64-installer.exe" ]; then
            cp "build/bin/flitnix-amd64-installer.exe" "artifacts/flitnix_${VERSION}_windows_amd64_setup.exe"
          else
            INSTALLER_EXE=$(ls build/bin/*installer*.exe | head -n 1)
            cp "${INSTALLER_EXE}" "artifacts/flitnix_${VERSION}_windows_amd64_setup.exe"
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-artifacts
          path: artifacts/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal App & DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build macOS App
        run: |
          wails build

      - name: Package macOS artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts

          # Find app bundle (whether Flitnix.app or flitnix.app)
          APP_DIR=$(ls -d build/bin/*.app | head -n 1)
          if [ -z "${APP_DIR}" ]; then
            echo "Error: macOS .app bundle not found in build/bin!" >&2
            exit 1
          fi

          # Create DMG
          hdiutil create -volname "Flitnix" -srcfolder "${APP_DIR}" -ov -format UDZO "artifacts/flitnix_${VERSION}_macOS_universal.dmg"

          # Create ZIP
          ditto -c -k --sequesterRsrc --keepParent "${APP_DIR}" "artifacts/flitnix_${VERSION}_macOS_universal.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: macos-artifacts
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Draft Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate all required release artifacts exist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REQUIRED_ASSETS=(
            "flitnix_${VERSION}_linux_amd64.deb"
            "flitnix_${VERSION}_linux_amd64.rpm"
            "flitnix_${VERSION}_linux_amd64.tar.gz"
            "flitnix_${VERSION}_windows_amd64_setup.exe"
            "flitnix_${VERSION}_macOS_universal.dmg"
            "flitnix_${VERSION}_macOS_universal.zip"
          )
          cd release-assets
          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Error: Required asset '$asset' is missing from release payload!" >&2
              exit 1
            fi
          done
          echo "All 6 required release assets present."

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum flitnix_* > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Create Draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --draft \
            --title "Flitnix ${GITHUB_REF_NAME}" \
            --generate-notes
