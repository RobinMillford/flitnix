name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify installer scripts
        run: |
          sh -n install.sh
          ./tests/install_test.sh

      - name: Verify mobile web assets
        run: |
          node --check internal/server/assets/app.js

      - name: Run Go unit and integration tests
        run: |
          go test -count=1 ./...

      - name: Run Go race detector on concurrency-sensitive packages
        run: |
          go test -race ./internal/transfer ./internal/server .

      - name: Frontend checks and tests
        run: |
          cd frontend
          npm ci
          npm test
          npm run check
          npm run build

      - name: Install Wails CLI & nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Test Linux application build
        run: |
          wails build -tags webkit2_41

      - name: Test Linux package assembly
        run: |
          bash scripts/package-linux.sh "0.1.0-ci" "amd64" "dist"
