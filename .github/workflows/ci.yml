name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify installer scripts
        run: |
          sh -n install.sh
          ./tests/install_test.sh

      - name: Verify mobile web assets
        run: |
          node --check internal/server/assets/app.js

      - name: Frontend checks and tests
        run: |
          cd frontend
          npm ci
          npm test
          npm run check
          npm run build

      - name: Verify frontend embed assets exist
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "::error::frontend/dist/index.html is missing; run 'npm ci && npm run build' in frontend/ before compiling Go (main.go embeds all:frontend/dist)" >&2
            exit 1
          fi
          echo "frontend/dist present for go:embed"

      - name: Compile every package
        run: go build ./...

      - name: Vet every package
        run: go vet ./...

      - name: Run Go unit and integration tests
        run: |
          go test -count=1 ./...

      - name: Run Go race detector
        run: |
          go test -race -count=1 ./...

      - name: Install Wails CLI & nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

      - name: Test Linux application build
        run: |
          wails build -tags webkit2_41

      - name: Test Linux package assembly
        run: |
          bash scripts/package-linux.sh "0.1.0-ci" "amd64" "dist"

      - name: Guard against unpinned @latest tool installs
        run: |
          if grep -RnE 'go install [^ ]+@latest' .github/workflows/; then
            echo "::error::Unpinned @latest go install found in workflows; pin an explicit tested version." >&2
            exit 1
          fi
          echo "No unpinned @latest tool installs in .github/workflows/."

  test-cross-platform:
    name: Native Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Frontend checks and tests
        shell: bash
        run: |
          cd frontend
          npm ci
          npm test
          npm run check
          npm run build

      - name: Verify frontend embed assets exist
        shell: bash
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "::error::frontend/dist/index.html is missing; run 'npm ci && npm run build' in frontend/ before compiling Go (main.go embeds all:frontend/dist)" >&2
            exit 1
          fi
          echo "frontend/dist present for go:embed"

      - name: Compile every package
        run: go build ./...

      - name: Vet every package
        run: go vet ./...

      - name: Run full Go test suite
        shell: bash
        run: go test -count=1 ./...

      - name: Run race detector (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: go test -race -count=1 ./...

      - name: Verify MinGW GCC and libsynchronization.a (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          gcc --version
          $lib = gcc --print-file-name libsynchronization.a
          Write-Host "Resolved libsynchronization.a: $lib"
          if (-not (Test-Path $lib)) {
            Write-Error "libsynchronization.a could not be found for CGO race detector"
            exit 1
          }

      - name: Run race detector (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          go test -race -count=1 ./...

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Test native application build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          wails build

      - name: Test native application build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          wails build
