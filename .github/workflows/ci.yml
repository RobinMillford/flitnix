name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify installer scripts
        run: |
          sh -n install.sh
          ./tests/install_test.sh

      - name: Verify mobile web assets
        run: |
          node --check internal/server/assets/app.js

      - name: Frontend checks and tests
        run: |
          cd frontend
          npm ci
          npm test
          npm run check
          npm run build

      - name: Verify frontend embed assets exist
        # main.go embeds all:frontend/dist; fail fast with a clear message if
        # the frontend build above did not produce it, before Go commands run.
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "::error::frontend/dist/index.html is missing; run 'npm ci && npm run build' in frontend/ before compiling Go (main.go embeds all:frontend/dist)" >&2
            exit 1
          fi
          echo "frontend/dist present for go:embed"

      - name: Run Go unit and integration tests
        run: |
          go test -count=1 ./...

      - name: Run Go race detector on concurrency-sensitive packages
        run: |
          go test -race ./internal/transfer ./internal/server .

      - name: Install Wails CLI & nfpm
        # Pinned to the exact versions the release workflow builds with
        # (release.yml), so CI validates the same packaging toolchain that
        # produces the shipped artifacts. A mutable @latest here would let an
        # upstream release change or break CI builds silently.
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

      - name: Test Linux application build
        run: |
          wails build -tags webkit2_41

      - name: Test Linux package assembly
        run: |
          bash scripts/package-linux.sh "0.1.0-ci" "amd64" "dist"

      - name: Guard against unpinned @latest tool installs
        # Supply-chain guard (Phase 2 hardening): every `go install` in CI and
        # release workflows must reference an explicit version. A mutable
        # @latest would silently re-point the build toolchain at whatever an
        # upstream module publishes next.
        run: |
          if grep -RnE 'go install [^ ]+@latest' .github/workflows/; then
            echo "::error::Unpinned @latest go install found in workflows; pin an explicit tested version." >&2
            exit 1
          fi
          echo "No unpinned @latest tool installs in .github/workflows/."

  # Cross-platform compile and vet. A successful build proves the source
  # compiles for the production targets; it does NOT prove native GUI
  # behaviour, drag-and-drop, file pickers or packaging on those systems.
  cross-platform-build:
    name: Build & vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build frontend embed assets
        # main.go embeds all:frontend/dist. GitHub Actions jobs run in
        # separate environments, so every job that compiles Go must produce
        # these assets itself before `go build` / `go vet` / `go test` run.
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Verify frontend embed assets exist
        shell: bash
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "::error::frontend/dist/index.html is missing; run 'npm ci && npm run build' in frontend/ before compiling Go (main.go embeds all:frontend/dist)" >&2
            exit 1
          fi
          echo "frontend/dist present for go:embed"

      - name: Compile every package
        run: go build ./...

      - name: Vet every package
        run: go vet ./...

      - name: Platform-neutral tests
        if: matrix.os != 'windows-latest'
        run: go test -count=1 ./internal/transfer ./internal/recovery ./internal/session ./internal/qr ./internal/settings

      # Windows access-control tests inspect real DACLs and can only fail on a
      # Windows kernel. Cross-compiling them proves they build, not that a
      # sensitive directory is private, so the job runs the actual binaries
      # here instead of deferring to the Linux job.
      - name: Run full test suite
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...

      - name: Check for a C toolchain for the race detector
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            echo "::error::gcc is required for 'go test -race' on windows-latest and was not found" >&2
            exit 1
          fi
          gcc --version | head -1

      - name: Run race detector
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -race -count=1 ./...
